name: Infra DB Deploy
# Execução manual: este workflow cria recursos pagos na AWS (terraform apply).
# Rode pela aba Actions > "Run workflow" quando quiser provisionar o ambiente.
on:
  workflow_dispatch:

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: 'us-east-1'
      
    steps:
      - uses: actions/checkout@v3
      - uses: hashicorp/setup-terraform@v2
      
      - run: terraform init
      - run: terraform apply -auto-approve -var="db_password=${{ secrets.DB_PASSWORD }}"